name: Python checks

on:
  push:
    branches:
      - cocfarm-migration-audit
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test runner
        run: python -m pip install --upgrade pytest pytest-xdist
      - name: Compile runtime
        run: python -m compileall -q farmbot
      - name: Run regression tests
        run: python -m pytest -q
