name: Import audited COCFARM runtime

on:
  workflow_dispatch:
  push:
    branches:
      - cocfarm-migration-audit
    paths:
      - .github/workflows/import-cocfarm.yml

permissions:
  contents: write

jobs:
  import-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: cocfarm-migration-audit
          fetch-depth: 0

      - name: Import the reviewed COCFARM snapshot
        shell: bash
        env:
          UPSTREAM_SHA: 46ddfa032e81baea8a6c62824468bea7c19ee413
        run: |
          set -euo pipefail
          upstream_dir="${RUNNER_TEMP}/cocfarm-upstream"
          git clone https://github.com/BilinP/COCFARM.git "$upstream_dir"
          git -C "$upstream_dir" checkout --detach "$UPSTREAM_SHA"

          # Keep the migration research document and this one-shot importer.
          mkdir -p "${RUNNER_TEMP}/preserved/docs"
          cp docs/COCFARM_MIGRATION_AUDIT.md "${RUNNER_TEMP}/preserved/docs/"

          while IFS= read -r -d '' path; do
            case "$path" in
              .github/workflows/import-cocfarm.yml|docs/COCFARM_MIGRATION_AUDIT.md) ;;
              *) git rm -rf -- "$path" ;;
            esac
          done < <(git ls-files -z)

          # Extract the pinned upstream tree into the repository root.
          git -C "$upstream_dir" archive "$UPSTREAM_SHA" | tar -x -C .
          mkdir -p docs
          cp "${RUNNER_TEMP}/preserved/docs/COCFARM_MIGRATION_AUDIT.md" docs/

          cat > docs/COCFARM_UPSTREAM_PIN.md <<EOF
          # COCFARM upstream source pin

          This repository uses COCFARM as its sole runtime base.

          - Upstream: https://github.com/BilinP/COCFARM
          - Imported commit: `$UPSTREAM_SHA`
          - Commit URL: https://github.com/BilinP/COCFARM/commit/$UPSTREAM_SHA
          - License: GNU GPL version 3 or later; see the root `LICENSE`.
          - Third-party notices: see `THIRD_PARTY_NOTICES.md` and `licenses/`.

          The source is copied into this repository, not linked as a submodule.
          Preserve upstream copyright and license notices. Review future upstream
          updates before integrating them; do not blindly overwrite local changes.

          ## Migration decisions

          - Local PC execution only.
          - No Web Dashboard, Telegram notifications, or iPhone Shortcut.
          - No external AI/OCR service; perception remains local.
          - No Dry Run mode.
          - Instant upgrade items may be used automatically only when eligibility
            and a valid target are positively identified.
          - Never spend gems or paid currency automatically.
          - Boost/timer automation remains optional and user-controlled.
          EOF

          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: migrate runtime to audited COCFARM snapshot"
          git push origin HEAD:cocfarm-migration-audit
